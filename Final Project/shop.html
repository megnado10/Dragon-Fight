<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="./shop.css">
        <title></title>
    </head>
    <body>
        <header>
            <div class="header-links">
            <a class="header-link" href="./arena.html" id="arenaButton">
                Arena
            </a>
            <a class="header-link" href="./shop.html" id="shopButton">
                Shop
            </a>
            <a class="header-link" href="./boss.html" id="bossButton">
                Boss!
            </a>
            </div>
            <div class="labelRow" id="clickerContainer">
                    <div class="label">Money:</div>
                    <div class="money" id="moneyOwned">0</div>
            </div>

            <div class="labelRow" id="clickerContainer">
                    <div class="label">Power:</div>
                    <div class="power" id="powerOwned">0</div>
            </div>

        </header>
        <main>
            <div class="grid">
                
                <div class="column-header" style="grid-column: 1 / 4">
                    Shop
                </div>
            
                <div class="grid-cell">
                    <input type="button" id="daggerBuy">
                    <p id="labelDagger">Price: 50</p>
                </div>
                <div class="grid-cell">
                    <input type="button" id="swordBuy">
                    <p id="labelSword">Price: 1,000</p>
                </div>

                <div class="grid-cell">
                    <input type="button" id="musketBuy">
                    <p id="labelMusket">Price: 10,000</p>
                </div> 
                <div class="grid-cell">
                    <input type="button" id="laserBuy">
                    <p id="labelLaser">Price: 100,000</p>
                </div>
                <div class="grid-cell">
                    <input type="button" id="cannonBuy">
                    <p id="labelCannon">Price: 500,000</p>
                </div>

                <div class="grid-cell">
                    <input type="button" id="lightsaberBuy">
                    <p id="labelLightsaber">Price: 1,000,000</p>
                </div>
        </main>
        <footer>
           <div class="secret-row">
                <button id="secretBad"></button>
                <button id="secretGood"></button>
            </div>
        </footer>
        <script src="./shop.js"></script>
    </body>
</html>
